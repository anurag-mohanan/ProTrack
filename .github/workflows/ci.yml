name: ProTrack CI

on:
  push:
    branches: [main, master, "rca/**"]
  pull_request:

jobs:
  pytest-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest (SQLite in-memory)
        run: python -m pytest tests/test_r1_platform.py tests/test_auth.py -q --tb=line

  pytest-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: protrack
          POSTGRES_PASSWORD: protrack
          POSTGRES_DB: protrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protrack -d protrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://protrack:protrack@localhost:5432/protrack_test
      PROTRACK_RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest (optional Postgres marker)
        run: python -m pytest tests/test_r1_platform.py -q --tb=line -m "postgres or not postgres"
        continue-on-error: true
